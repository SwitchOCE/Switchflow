name: Switchflow governance
on:
  pull_request:
    paths: ['AGENTS.md', '.agents/**', '.switchflow/**', 'backlog/**', 'backlog.config.yml', '.github/workflows/switchflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .switchflow/package-lock.json
      - run: npm --prefix .switchflow ci --ignore-scripts
      - name: Check recorded task dependencies and document links
        shell: pwsh
        run: |
          ./.switchflow/scripts/backlog.ps1 doctor
          ./.switchflow/scripts/check-docs.ps1
